# Análise estrita para o monorepo inteiro. Os pacotes herdam daqui; nenhum
# afrouxa regra por conta própria.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Aviso tratado como erro: o projeto só aceita commit com análise limpa.
    todo: error
  exclude:
    - "**/*.g.dart"
    - "**/build/**"
    - "spikes/**"

linter:
  rules:
    # Docstring em português explicando o porquê é regra do projeto; o lint
    # garante que todo membro público tenha uma.
    public_member_api_docs: true
    # Linhas longas em tabelas de tokens são mais legíveis que quebradas.
    lines_longer_than_80_chars: false
