name: cajui_workspace
description: Raiz do monorepo do Cajui. Só declara o workspace e as ferramentas comuns.
publish_to: none

environment:
  sdk: ^3.13.4

# Um único pubspec.lock na raiz: app, servidor e pacotes resolvem as mesmas
# versões, que é o que permite compartilhar o domínio sem surpresa.
workspace:
  - packages/domain
  - packages/design_system
  - packages/design_system/gallery
  - tool/code_metrics

dev_dependencies:
  very_good_analysis: ^11.0.0
