<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sample navegável do design system do Cajui: tokens, componentes, telas de estado, som e movimento.">
  <meta name="theme-color" content="#FBF6EE">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Cajui · design system</title>
  <!--
    O primeiro quadro não espera o Flutter: a cor da marca e o nome aparecem
    assim que o HTML chega, e somem quando o app desenha por cima.
  -->
  <style>
    html, body { height: 100%; margin: 0; background: #FBF6EE; }
    #shell {
      position: fixed; inset: 0; display: grid; place-content: center;
      text-align: center; color: #2A1D17;
      font: 600 2rem/1.2 Georgia, "Times New Roman", serif;
    }
    #shell small {
      display: block; margin-top: .5rem; color: #5F4E44;
      font: 400 .875rem/1.4 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <main id="shell" aria-live="polite">
    Cajui
    <small>Carregando o design system…</small>
  </main>
  <noscript>O sample do design system do Cajui precisa de JavaScript para abrir.</noscript>
  <script>
    // O Flutter avisa quando desenhou o primeiro quadro; só então a casca sai.
    window.addEventListener('flutter-first-frame', function () {
      var shell = document.getElementById('shell');
      if (shell) shell.remove();
      performance.mark('cajui:first-frame');
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
