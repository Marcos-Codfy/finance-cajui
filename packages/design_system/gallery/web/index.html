<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A gallery do design system do Cajui, app Android de finanças pessoais: as telas do app em todos os estados, componentes, movimento 3D e som.">
  <meta name="theme-color" content="#FBF6EE">
  <!--
    A prévia do link: colado no LinkedIn, no WhatsApp ou no currículo, o
    endereço mostra a porta de entrada, e não um quadro em branco. O
    endereço da imagem é absoluto porque quem lê a prévia não segue o
    base href.
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Cajui">
  <meta property="og:title" content="Cajui · design system">
  <meta property="og:description" content="As telas do app em todos os estados, componentes, movimento 3D e som — com números inventados.">
  <meta property="og:url" content="https://cajui-teal.vercel.app/gallery/">
  <meta property="og:image" content="https://cajui-teal.vercel.app/gallery/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A porta de entrada da gallery do Cajui: o widget de vidro sobre a aurora e os atalhos para as telas do app.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Cajui · design system</title>
  <!--
    O primeiro quadro não espera o Flutter: a cor da marca e o nome aparecem
    assim que o HTML chega, e somem quando o app desenha por cima.
  -->
  <style>
    html, body { height: 100%; margin: 0; background: #FBF6EE; }
    #shell {
      position: fixed; inset: 0; display: grid; place-content: center;
      text-align: center; color: #2A1D17;
      font: 600 2rem/1.2 Georgia, "Times New Roman", serif;
    }
    #shell small {
      display: block; margin-top: .5rem; color: #5F4E44;
      font: 400 .875rem/1.4 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <main id="shell" aria-live="polite">
    Cajui
    <small>Carregando o design system…</small>
  </main>
  <noscript>O sample do design system do Cajui precisa de JavaScript para abrir.</noscript>
  <script>
    // O Flutter avisa quando desenhou o primeiro quadro; só então a casca sai.
    window.addEventListener('flutter-first-frame', function () {
      var shell = document.getElementById('shell');
      if (shell) shell.remove();
      performance.mark('cajui:first-frame');
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
