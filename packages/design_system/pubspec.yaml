name: design_system
description: Tokens, tema e componentes do Cajui. Fonte única de tudo o que é visual, sonoro e de movimento.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  # Tocador de áudio da gallery e da primeira versão do app. A medição de
  # latência contra alternativas, em aparelho real, fecha a escolha na
  # ADR-016 (BL-009); por isso ele fica atrás da interface SoundPlayer.
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: false

  # Sons sintetizados por tool/sound/build_sounds.py. Autoria do projeto.
  assets:
    - assets/sounds/

  # Fontes empacotadas: o app nunca busca fonte na rede em uso (RNF-PRIV-05).
  # As duas são variáveis; peso e eixos são escolhidos por FontVariation.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
