<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Cajui — o seu controle financeiro, em modo consulta. Os lançamentos são feitos no celular; aqui você olha e pergunta.">
  <!-- A cor da barra do navegador segue o tema, como a do app. -->
  <meta name="theme-color" content="#FAF5EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
  <!-- Isto é dado de uma pessoa só: nada disso tem por que aparecer em busca. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Cajui</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    /* A primeira tinta é nossa, e não do motor: sem isto a página fica em
       branco até o Flutter subir, e branco puro no escuro machuca. */
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; background: #FAF5EE; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #1A1512; }
    }
    #abertura {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font: 400 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #6B5D4F;
      transition: opacity 240ms ease-out;
    }
    @media (prefers-color-scheme: dark) { #abertura { color: #A79683; } }
    body.pronto #abertura { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <!-- Some sozinho quando o Flutter pinta o primeiro quadro. Texto, e não
       roda girando: quem lê com leitor de tela também precisa saber que a
       página está vindo. -->
  <div id="abertura" role="status">Abrindo o Cajui…</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.add('pronto');
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
