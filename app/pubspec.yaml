name: cajui
description: Cajui - controle financeiro pessoal. Android é o app de uso; a web é modo consulta.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  api_contract:
    path: ../packages/api_contract
  # O mesmo SHA-256 do registro de eventos: o identificador do aparelho é
  # derivado da chave pública, e não sorteado (ADR-008).
  cryptography: ^2.7.0
  design_system:
    path: ../packages/design_system
  domain:
    path: ../packages/domain
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  # O cliente HTTP que existe **nos dois mundos**. O `HttpClient` do
  # `dart:io` não existe no navegador: lá ele é um substituto que estoura ao
  # ser criado, e derrubava a web inteira antes do primeiro quadro.
  http: ^1.2.2
  meta: ^1.16.0
  path: ^1.9.0
  path_provider: ^2.1.5
  persistence:
    path: ../packages/persistence

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: false
